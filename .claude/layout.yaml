# path -> role/rules/phase. phase: scaffold = exists now. Planned items carry the PR (branch) name that adds them.
paths:
  README.md: {role: quick reference (setup, doctor, test, lint, pin-check), phase: scaffold}
  Makefile: {role: entry point; docker only; targets setup doctor sim-image dev-image sim-test unit lint pin-check bump-racecar lsp, rules: [.claude/rules/dependencies.md, .claude/rules/sim.md], phase: scaffold}
  repos/racecar.repos: {role: vcstool pin of the car repo (40-hex SHA), rules: .claude/rules/sim.md, invariants: ["bump with make bump-racecar", "make pin-check"], phase: scaffold}
  repos/README.md: {role: bump procedure, phase: scaffold}
  docker/sim.Dockerfile: {role: "sim image; stages builder/test/runtime; base = car ROS digest; ros-jazzy-ros-gz; vcs import racecar", rules: .claude/rules/dependencies.md, phase: scaffold}
  docker/dev.Dockerfile: {role: "dev image FROM sim builder; pyright, ruff, pytest", rules: .claude/rules/claude-tooling.md, phase: scaffold}
  docker/entrypoint.sh: {role: sources /opt/ros/jazzy + /ws/install then exec, phase: scaffold}
  docker/sim-test.sh: {role: colcon test + test-result in the test stage; copies log/xml to /out, phase: scaffold}
  docker/gym.Dockerfile: {role: pytorch digest + pinned lock + f1tenth_gym, planned: gym}
  tools/lsp/: {role: "pyright-langserver docker shim + smoke.py (LSP initialize test)", rules: .claude/rules/claude-tooling.md, phase: scaffold}
  tools/doctor.sh: {role: make doctor checks (PASS/FAIL/SKIP), rules: .claude/rules/wsl.md, phase: scaffold}
  tests/: {role: "pytest in the dev image: test_pin, test_rules_paths, test_sim_guard", phase: scaffold}
  pyrightconfig.json: {role: pyright config (root; missing imports = warning), rules: .claude/rules/claude-tooling.md, phase: scaffold}
  ruff.toml: {role: ruff config, phase: scaffold}
  docs/setup.md: {role: WSL host setup, training, sanity checks, versions, rules: .claude/rules/wsl.md, phase: scaffold}
  .github/workflows/sim.yml: {role: ci: build, sim-test, pin-check, unit; no gpu, rules: .claude/rules/claude-tooling.md, phase: scaffold}
  .claude/: {role: CLAUDE.md, layout.yaml, rules, agents, skills, hooks, settings.json, phase: scaffold}
  .claude/hooks/sim_guard.py: {role: PreToolUse guard (real Mapper deny; car hardware targets ask), rules: .claude/rules/sim.md, phase: scaffold}
  .claude/agents/sim-reviewer.md: {role: reviews diffs vs rules + sim safety checks, phase: scaffold}
  .claude/skills/wsl-docker-ros2/: {role: WSL + Docker Desktop + ROS 2 knowledge skill, phase: scaffold}
  .claude/skills/sim-parity/: {role: stub; points to the car skill + sim-side steps, phase: scaffold}
  .claude/skills/sim-bump-pin/: {role: procedure to bump the car pin, phase: scaffold}
  compose.yaml: {role: gz, mcu-sim, mapper-sim, core, drivers, foxglove, gym; profiles, planned: sim-gz}
  dds/: {role: Fast DDS 2.14 discovery server profile, planned: sim-gz}
  rccar_sim_mcu/: {role: virtual ESP32 (model + node), planned: sim-mcu}
  rccar_sim_mapper/: {role: virtual Mapper TCP server, planned: sim-mapper}
  rccar_sim_gz/: {role: Gazebo world, bridge config, planned: sim-gz}
  rccar_sim_bringup/: {role: sim launch files, planned: sim-gz}
  rccar_gym/: {role: gymnasium env, configs, train.py (no ROS), planned: gym}
  rccar_racing/: {role: follow_the_gap, wall_follow, benchmark; output only on /rccar/cmd/captain, planned: racing}
  datasets/: {role: public dataset index; no data in git, planned: gym}
planned_skills: {sim-safety-check: sim-mcu, new-sim-sensor: sim-mapper, gazebo-robotics: sim-gz, robotics-simulation-validation: sim-gz, f1tenth-racing: gym, autonomous-racing-algorithms: racing}
